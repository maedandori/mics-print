[package]
name = "mics-print"
version = "0.1.0"
edition = "2021"
autobins = false
description = "Rust Print Agent dry-run and benchmark prototype"

[features]
agent-icon = []
settings-icon = []

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
rsfbclient = { version = "=0.29.0", default-features = false, features = ["pure_rust"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
url = "2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tungstenite = { version = "0.24", features = ["native-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0", features = ["tray-notification", "message-window", "menu", "cursor", "embed-resource", "progress-bar", "timer"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "print-tray-rust"
path = "src/bin/print-tray-rust.rs"

[[bin]]
name = "print-settings-rust"
path = "src/bin/print-settings-rust.rs"

[[bin]]
name = "print-agent-rust"
path = "src/bin/print-agent-rust.rs"

[[bin]]
name = "mics-credentials"
path = "src/bin/mics-credentials.rs"
